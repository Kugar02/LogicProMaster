<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卓天尊享商城 - 司機專屬大數據平台</title>
    <!-- 引入 Tailwind CSS 快速佈局 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- 頂部導航 -->
    <header class="bg-yellow-500 text-black p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">🚖 卓天尊享商城</h1>
            <span class="text-xs bg-black text-white px-2 py-1 rounded">車隊官方自研版 (MVP)</span>
        </div>
    </header>

    <!-- 主體內容 -->
    <main class="container mx-auto p-4 max-w-xl">
        
        <!-- AI 智能搜索框 (支持語音) -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">🤖 AI 司機智能助理 (支援廣東話口語)：</label>
            <div class="relative flex items-center">
                <input id="searchInput" type="text" placeholder="例：下大雨睇唔清 / 交更車廂有煙味..." 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm">
                <!-- 麥克風按鈕 -->
                <button id="voiceBtn" class="absolute right-3 text-gray-500 hover:text-red-500 focus:outline-none" title="語音輸入">
                    🎤
                </button>
            </div>
        </div>

        <!-- 的士司機專屬：場景快選標籤 (Tags Filter) -->
        <div class="mb-4">
            <p class="text-xs text-gray-500 font-bold mb-2 uppercase tracking-wider">按日常駕駛場景快速篩選：</p>
            <div class="flex flex-wrap gap-2" id="tagContainer">
                <button onclick="filterByTag('')" class="tag-btn bg-black text-white text-xs px-3 py-1.5 rounded-full font-medium">全部商品</button>
                <button onclick="filterByTag('夜更提神')" class="tag-btn bg-white text-gray-700 border border-gray-200 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-gray-50">#夜更提神 💊</button>
                <button onclick="filterByTag('雨天視野')" class="tag-btn bg-white text-gray-700 border border-gray-200 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-gray-50">#雨天視野 🌧️</button>
                <button onclick="filterByTag('交更除臭')" class="tag-btn bg-white text-gray-700 border border-gray-200 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-gray-50">#交更除臭 🧼</button>
                <button onclick="filterByTag('腰酸骨痛')" class="tag-btn bg-white text-gray-700 border border-gray-200 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-gray-50">#腰酸骨痛 🩹</button>
                <button onclick="filterByTag('車載快充')" class="tag-btn bg-white text-gray-700 border border-gray-200 text-xs px-3 py-1.5 rounded-full font-medium hover:bg-gray-50">#車載快充 📱</button>
            </div>
        </div>

        <!-- 商品/套餐 列表展示區域 -->
        <div id="productGrid" class="space-y-4">
            <!-- 數據將由 JavaScript 動態渲染載入 -->
        </div>

    </main>

    <!-- 前端互動與 API 異步請求邏輯 -->
    <script>
        let currentTag = '';
        let searchTimeout = null;

        // 頁面初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();

            // 監聽輸入框，實現動態 AI 篩選（防抖處理）
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    loadProducts(currentTag, e.target.value);
                }, 300); // 停止輸入 300 毫秒後觸發 AI 篩選
            });

            // 語音識別功能 (Web Speech API)
            const voiceBtn = document.getElementById('voiceBtn');
            const searchInput = document.getElementById('searchInput');
            
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-HK'; // 設定為廣東話/香港粵語
                
                voiceBtn.addEventListener('click', () => {
                    recognition.start();
                    voiceBtn.innerText = '🛑';
                });

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    searchInput.value = text;
                    loadProducts(currentTag, text);
                };

                recognition.onend = () => {
                    voiceBtn.innerText = '🎤';
                };
            } else {
                voiceBtn.style.display = 'none'; // 瀏覽器不支援則隱藏
            }
        });

        // 標籤切換
        function filterByTag(tag) {
            currentTag = tag;
            document.getElementById('searchInput').value = ''; // 切換標籤時清空搜索
            loadProducts(tag, '');
            
            // 更新標籤按鈕高亮樣式
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-black', 'text-white');
        }

        // 異步請求後端 Server 的 AI 篩選接口
        async function loadProducts(tag = '', search = '') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '<div class="text-center text-gray-500 text-sm py-8">AI 正在篩選整合全網大數據車品...</div>';

            try {
                const response = await fetch(`/api/products?tag=${tag}&search=${encodeURIComponent(search)}`);
                const products = await response.json();

                if (products.length === 0) {
                    grid.innerHTML = '<div class="text-center text-gray-500 text-sm py-8">找不到相關推薦，試試換個場景形容？</div>';
                    return;
                }

                grid.innerHTML = products.map(p => `
                    <div class="bg-white rounded-xl p-4 shadow-sm flex gap-4 items-center">
                        <img src="${p.img}" alt="${p.name}" class="w-24 h-24 object-cover rounded-lg bg-gray-100 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <span class="inline-block text-[10px] bg-red-50 text-red-600 font-bold px-1.5 py-0.5 rounded mb-1 border border-red-200">${p.taobao_sales_mock}</span>
                            <h3 class="text-sm font-bold text-gray-900 truncate">${p.name}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.desc}</p>
                            <div class="mt-2 flex justify-between items-center">
                                <span class="text-lg font-black text-yellow-600"><span class="text-xs font-normal">HK$</span>${p.price}</span>
                                <button class="bg-yellow-500 text-black text-xs font-bold px-3 py-1.5 rounded-lg active:bg-yellow-600">
                                    查看詳情
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = '<div class="text-center text-red-500 text-sm py-8">Server 連線失敗，請檢查後端是否啟動。</div>';
            }
        }
    </script>
</body>
</html>
